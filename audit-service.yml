spring:
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/cloud_drive_audit}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
