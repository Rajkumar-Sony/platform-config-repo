keycloak:
  admin:
    url: http://localhost:8180
    realm: cloud-drive-manager
    client-id: cloud-drive-backend
    client-secret: "{cipher}AUTH_SERVICE_KEYCLOAK_CLIENT_SECRET"

spring:
  datasource:
    url: "{cipher}AUTH_SERVICE_DB_URL"
    username: "{cipher}AUTH_SERVICE_DB_USERNAME"
    password: "{cipher}AUTH_SERVICE_DB_PASSWORD"
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
